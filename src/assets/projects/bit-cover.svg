<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Vista previa del proyecto BIT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf9ef"/>
      <stop offset=".55" stop-color="#f6ecd7"/>
      <stop offset="1" stop-color="#f1e4c9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c96a"/>
      <stop offset=".5" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#b87333"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#a9742e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f4e6c0" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f7eeda"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8c96a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e8c96a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c9a227" stop-opacity=".5"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b87333" stop-opacity=".32"/>
      <stop offset="1" stop-color="#b87333" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#8a5a1c" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#b8860b" fill-opacity=".16"/>
    </pattern>
    <filter id="blurXL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="45" flood-color="#6d4613" flood-opacity=".22"/>
    </filter>
    <filter id="neon" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <ellipse cx="180" cy="80" rx="520" ry="440" fill="url(#glowCyan)" filter="url(#blurXL)"/>
  <ellipse cx="1470" cy="250" rx="520" ry="460" fill="url(#glowViolet)" filter="url(#blurXL)"/>
  <ellipse cx="1150" cy="980" rx="520" ry="320" fill="url(#glowPink)" filter="url(#blurXL)"/>
  <rect x="90" y="540" width="520" height="340" fill="url(#dots)" opacity=".5"/>

  <!-- Brand lockup -->
